<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#CE1126" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="Ratio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Ratio is smart scheduling software for tutoring centres — auto-scheduler, availability, shift swaps, payroll, and team chat in one portal." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ratio" />
    <link rel="canonical" href="https://ratiosolved.com/" />

    <!-- Open Graph (Facebook / LinkedIn / iMessage previews) -->
    <meta property="og:site_name" content="Ratio" />
    <meta property="og:title" content="Ratio — Smart Scheduling for Tutoring Centres" />
    <meta property="og:description" content="Auto-scheduler, availability, shift swaps, payroll, and team chat in one portal — built for tutoring centres." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ratiosolved.com/" />
    <meta property="og:image" content="https://ratiosolved.com/ratio-logo.png" />
    <meta property="og:image:alt" content="Ratio logo" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ratio — Smart Scheduling for Tutoring Centres" />
    <meta name="twitter:description" content="Auto-scheduler, availability, shift swaps, payroll, and team chat in one portal — built for tutoring centres." />
    <meta name="twitter:image" content="https://ratiosolved.com/ratio-logo.png" />

    <!-- Connection warmups: cuts ~150–300ms off Firebase's first auth / Firestore round-trip -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <title>Ratio — Smart Scheduling for Tutoring Centres</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family:system-ui,sans-serif;max-width:560px;margin:80px auto;padding:24px;border:1px solid #eee;border-radius:12px;text-align:center;color:#333">
        <h1 style="margin:0 0 8px;font-size:20px">Ratio requires JavaScript</h1>
        <p style="margin:0;color:#666">Please enable JavaScript in your browser to use the Ratio portal.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
